# AutoRechercheAlternance Portal Scanner Configuration
# CONFIGURATION INDUSTRIELLE : Sami Belmihoub — Alternance Administrateur Systèmes et Réseaux Bac+3 (Paris)

# -- Location filter --
# Focalisation sur Paris et Île-de-France
location_filter:
  allow:
    - "Paris"
    - "Île-de-France"
    - "75"
    - "92"
    - "93"
    - "94"
    - "Remote"
    - "Télétravail"
  block:
    - "United States"
    - "USA"
    - "India"
    - "United Kingdom"
    - "Germany"

# -- Title filter --
# Focus sur Administrateur Systèmes et Réseaux niveau Bac+3
title_filter:
  positive:
    # -- Cœur du profil : Systèmes & Réseaux --
    - "Administrateur Systèmes et Réseaux"
    - "Administrateur Systèmes & Réseaux"
    - "Administrateur Systèmes"
    - "Administrateur Réseaux"
    - "Admin Sys"
    - "Admin Réseaux"
    - "Technicien Systèmes"
    - "Technicien Réseaux"
    - "Technicien Informatique"
    - "Infrastructure"
    - "Cloud"
    - "Exploitation"
    # -- Termes contractuels et Niveau --
    - "Alternance"
    - "Apprentissage"
    - "Apprenti"
    - "Bac+3"
    - "Bachelor"
    - "L3"
    - "CSI"
    - "Développeur"
    - "Developer"
    - "Fullstack"
    - "IL"
  negative:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Director"
    - "Architect"
    - "Manager"
    - "Directeur"
    - "Stage"
    - "Intern"
    - "Marketing"
    - "Sales"
    - "RH"
    - "Recrutement"

# -- Search queries --
# Interrogation ciblée avec les mots-clés : Alternance, Bac+3, Paris, Administrateur Systèmes et Réseaux
search_queries:
  # -- LINKEDIN FRANCE --
  - name: LinkedIn — Alternance Admin Systèmes & Réseaux Paris Bac+3
    query: 'site:linkedin.com/jobs "Alternance" "Administrateur Systèmes et Réseaux" Paris "Bac+3"'
    enabled: true
  - name: LinkedIn — Alternance Infrastructure IT Paris
    query: 'site:linkedin.com/jobs "Alternance" "Systèmes" "Réseaux" Paris'
    enabled: true
  - name: LinkedIn — Alternance Support / Admin Junior
    query: 'site:linkedin.com/jobs "Alternance" "Technicien Systèmes" OR "Support IT" Paris'
    enabled: true

  # -- FRANCE TRAVAIL --
  - name: France Travail — Alternance Réseaux & Systèmes 75
    query: 'site:francetravail.fr/offres "Alternance" "Administrateur Systèmes" Paris'
    enabled: true

  # -- HELLOWORK, INDEED, METEOJOB --
  - name: HelloWork — Alternance Admin Systèmes Paris
    query: 'site:hellowork.com "Alternance" "Administrateur Systèmes et Réseaux" Paris'
    enabled: true
  - name: Indeed — Alternance Bac+3 Systèmes Réseaux
    query: 'site:indeed.com "Alternance" "Bac+3" "Systèmes et Réseaux" Paris'
    enabled: true
  - name: Meteojob — Alternance Systèmes Réseaux Paris
    query: 'site:meteojob.com "Alternance" "Administrateur Systèmes" Paris'
    enabled: true

  # -- JEUNES ET ÉTUDIANTS --
  - name: JobTeaser — Alternance Systèmes Réseaux Paris
    query: 'site:jobteaser.com "Alternance" "Systèmes" "Paris"'
    enabled: true

  # -- WELCOME TO THE JUNGLE --
  - name: Welcome to the Jungle — Alternance Admin Sys/Réseaux
    query: 'site:welcometothejungle.com "Alternance" "Administrateur Systèmes" Paris'
    enabled: true

  # -- ATS GLOBALS (Greenhouse, Ashby, Lever) --
  - name: Greenhouse France — Alternance IT
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Alternance" "Systems" Paris'
    enabled: true

  # -- LINKEDIN AVANCÉ (Dernières 24h) --
  - name: LinkedIn — Alternance SysAdmin (Dernières 24h)
    query: 'site:linkedin.com/jobs "alternance" "systèmes" "réseaux" Paris when:1d'
    enabled: true


